<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Login — SkillHub Kenya</title><link rel="stylesheet" href="style.css"></head><body><script src="app.js"></script><script>
layout(`<main class="container"><div class="card form-card"><div class="eyebrow">WELCOME BACK</div><h1>Login</h1><form id="form"><div class="form-row"><label>Email</label><input id="email" type="email" class="input" required></div><div class="form-row"><label>Password</label><input id="pass" type="password" class="input" required></div><button>Login</button></form><p>New here? <a href="register.html" style="color:var(--blue)">Create an account</a></p><p class="small">Demo mode: this frontend stores your account in this browser.</p></div></main>`);
form.onsubmit=e=>{e.preventDefault();const s=state();if(!s.user||s.user.email!==email.value){alert('No account found for that email. Register first.');return}location.href='dashboard.html'};
</script></body></html>
