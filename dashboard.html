<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Dashboard — SkillHub Kenya</title><link rel="stylesheet" href="style.css"></head><body><script src="app.js"></script><script>
if(!requireUser()){} else {const s=state();layout(`<main class="dashboard container"><div class="eyebrow">YOUR SPACE</div><h1 style="font-size:42px">Welcome, ${esc(s.user.fullname)}.</h1><div class="dashgrid"><div class="card metric"><span class="small">Applications</span><strong>${s.applications.length}</strong></div><div class="card metric"><span class="small">Saved jobs</span><strong>${s.saved.length}</strong></div><div class="card metric"><span class="small">Profile</span><strong>80%</strong></div><div class="card metric"><span class="small">Alerts</span><strong>${s.alerts.length}</strong></div></div><div class="profile"><div class="card"><h3>Account</h3><p><b>${esc(s.user.fullname)}</b><br>${esc(s.user.email)}<br>Job seeker</p><button class="danger" onclick="logout()">Log out</button></div><div class="card"><h3>My applications</h3><div id="apps" class="list"></div><hr><h3>Saved jobs</h3><div id="saved" class="list"></div></div></div><div class="card" style="margin-top:20px"><h3>Employer tools</h3><p>Employers can use this area to publish opportunities. The current build keeps job posting in browser storage; a production backend/payment provider can be connected next.</p><button onclick="postJob()">Post a job</button></div></main><div id="modal" class="modal"></div>`);renderDash()}
function renderDash(){const s=state();document.getElementById('apps').innerHTML=s.applications.length?s.applications.map(a=>{const j=s.jobs.find(x=>x.id===a.jobId);return `<div class="listrow"><span>${esc(j?.title||'Job')}<br><span class="small">${esc(a.status)}</span></span><span class="small">${new Date(a.date).toLocaleDateString()}</span></div>`}).join(''):'<div class="empty">No applications yet.</div>';document.getElementById('saved').innerHTML=s.saved.length?s.saved.map(id=>{const j=s.jobs.find(x=>x.id===id);return `<div class="listrow"><span>${esc(j?.title||'Job')}<br><span class="small">${esc(j?.company||'')}</span></span><button class="secondary" onclick="location.href='jobs.html'">Browse</button></div>`}).join(''):'<div class="empty">No saved jobs yet.</div>'}
function postJob(){document.getElementById('modal').innerHTML=`<div class="modalbox"><button class="close" onclick="closeModal()">×</button><h2>Post an opportunity</h2><form id="post"><div class="form-row"><label>Company</label><input id="pc" class="input" required></div><div class="form-row"><label>Job title</label><input id="pt" class="input" required></div><div class="form-row"><label>Location</label><input id="pl" class="input" required></div><div class="form-row"><label>Category</label><input id="pca" class="input" required></div><div class="form-row"><label>Type</label><select id="pty" class="select"><option>Full-time</option><option>Part-time</option><option>Contract</option><option>Internship</option><option>Remote</option></select></div><button>Publish job</button></form></div>`;document.getElementById('modal').classList.add('show');post.onsubmit=e=>{e.preventDefault();const s=state();s.jobs.unshift({id:Date.now().toString(),company:pc.value,title:pt.value,location:pl.value,category:pca.value,type:pty.value,salary:'Negotiable',description:'Employer-posted opportunity.'});save(s);closeModal();alert('Job published in this browser.');renderDash()}}
</script></body></html>
