<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Jobs — SkillHub Kenya</title><link rel="stylesheet" href="style.css"></head><body><script src="app.js"></script><script>
layout(`<main class="section"><div class="container"><div class="eyebrow">OPPORTUNITIES</div><h1 style="font-size:42px">Find your next opportunity</h1><p>Search jobs, internships and remote work across Kenya.</p><div class="toolbar"><input id="q" class="input" placeholder="Search jobs, skills or companies"><input id="loc" class="input" placeholder="Location"><select id="category" class="select"><option value="">All categories</option><option>Technology</option><option>Design</option><option>Sales & Marketing</option><option>Finance</option><option>Customer Support</option></select><select id="type" class="select"><option value="">All types</option><option>Full-time</option><option>Part-time</option><option>Contract</option><option>Internship</option><option>Remote</option></select></div><div class="section-head"><h2>Available jobs</h2><span id="count" class="small"></span></div><div id="jobGrid" class="grid"></div></div></main><div id="modal" class="modal"></div>`);
const p=new URLSearchParams(location.search);document.getElementById('q').value=p.get('q')||'';['q','loc','category','type'].forEach(x=>document.getElementById(x).addEventListener('input',renderJobs));renderJobs();
</script></body></html>
