<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Register — SkillHub Kenya</title><link rel="stylesheet" href="style.css"></head><body><script src="app.js"></script><script>
layout(`<main class="container"><div class="card form-card"><div class="eyebrow">JOIN SKILLHUB</div><h1>Create your account</h1><p>Build your profile and start discovering opportunities.</p><form id="form"><div class="form-row"><label>Full name</label><input id="name" class="input" required></div><div class="form-row"><label>Email</label><input id="email" type="email" class="input" required></div><div class="form-row"><label>Password</label><input id="pass" type="password" minlength="6" class="input" required></div><button>Create account</button></form><p>Already registered? <a href="login.html" style="color:var(--blue)">Login</a></p></div></main>`);
form.onsubmit=e=>{e.preventDefault();const s=state();s.user={fullname:name.value,email:email.value,role:'jobseeker'};save(s);location.href='dashboard.html'};
</script></body></html>
